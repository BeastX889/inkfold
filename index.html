<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkfold – PDF & Image Toolbox</title>
<meta name="description" content="Sign, merge, split, compress and protect PDFs, and convert images. Works offline; your files never leave your device.">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1d22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Tools">
    <a class="brand" href="#" data-route="home">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <span>Inkfold</span>
    </a>
    <div class="rail-list" id="railList"></div>
    <div class="rail-foot">
      <button class="rail-btn" id="themeBtn" type="button" aria-label="Switch theme"></button>
      <a class="rail-btn" href="#about" data-route="about">About &amp; privacy</a>
      <button class="rail-btn rail-support" id="supportBtn" type="button" hidden><span aria-hidden="true">&#9749;</span> Support Inkfold</button>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="busy" id="busy" hidden><div class="busy-card"><div class="spinner"></div><div id="busyText">Working…</div><div class="bar"><i id="busyBar"></i></div></div></div>
<dialog id="dlg"></dialog>
<div class="dropveil" id="dropveil" hidden><div>Drop files to open them</div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
